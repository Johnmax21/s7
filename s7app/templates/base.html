<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>{% block title %}S7{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "surface-container-lowest": "#0c0e12",
          "inverse-surface": "#e1e2e7",
          "tertiary-fixed-dim": "#bec6e0",
          "background": "#111417",
          "on-secondary": "#003829",
          "on-error": "#690005",
          "surface-container-high": "#282a2e",
          "surface-container": "#1d2023",
          "on-secondary-fixed-variant": "#0b513d",
          "on-secondary-container": "#83c2a9",
          "surface-bright": "#37393d",
          "on-primary-container": "#005e2d",
          "on-primary-fixed": "#00210c",
          "tertiary": "#d8e0fa",
          "surface-tint": "#4de082",
          "primary-fixed": "#6dfe9c",
          "surface-dim": "#111417",
          "outline": "#869486",
          "surface-container-low": "#191c1f",
          "on-tertiary-fixed-variant": "#3f465c",
          "surface-container-highest": "#323539",
          "secondary-container": "#0b513d",
          "secondary-fixed": "#b0f0d6",
          "inverse-primary": "#006d36",
          "primary-fixed-dim": "#4de082",
          "on-primary-fixed-variant": "#005227",
          "outline-variant": "#3d4a3e",
          "surface-variant": "#323539",
          "on-tertiary": "#283044",
          "primary-container": "#4ade80",
          "error-container": "#93000a",
          "on-error-container": "#ffdad6",
          "on-secondary-fixed": "#002117",
          "on-surface-variant": "#bccabb",
          "on-tertiary-fixed": "#131b2e",
          "on-background": "#e1e2e7",
          "on-surface": "#e1e2e7",
          "secondary": "#95d3ba",
          "error": "#ffb4ab",
          "tertiary-fixed": "#dae2fd",
          "on-primary": "#003919",
          "tertiary-container": "#bcc4de",
          "secondary-fixed-dim": "#95d3ba",
          "surface": "#111417",
          "on-tertiary-container": "#495166",
          "primary": "#6bfb9a",
          "inverse-on-surface": "#2e3134"
        },
        "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        "spacing": { "bottom-nav-height": "80px", "gutter": "16px", "unit": "4px", "margin-mobile": "20px", "margin-desktop": "48px" },
        "fontFamily": {
          "body-lg": ["DM Sans"], "label-caps": ["Bebas Neue"], "headline-lg-mobile": ["Bebas Neue"],
          "title-md": ["DM Sans"], "display-xl": ["Bebas Neue"], "headline-lg": ["Bebas Neue"], "body-sm": ["DM Sans"]
        },
        "fontSize": {
          "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "label-caps": ["14px", {"lineHeight": "14px", "letterSpacing": "0.1em", "fontWeight": "400"}],
          "headline-lg-mobile": ["28px", {"lineHeight": "28px", "letterSpacing": "0.04em", "fontWeight": "400"}],
          "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
          "display-xl": ["64px", {"lineHeight": "60px", "letterSpacing": "0.02em", "fontWeight": "400"}],
          "headline-lg": ["36px", {"lineHeight": "36px", "letterSpacing": "0.04em", "fontWeight": "400"}],
          "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
        }
      }
    }
  };
</script>
<style>
  .glass-card { background: rgba(6, 78, 59, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
  .active-glow { border: 1px solid #6bfb9a; box-shadow: 0 0 20px rgba(77,224,130,0.2); }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .perspective-1000 { perspective: 1000px; }
  .card-inner { transition: transform 0.6s cubic-bezier(0.23,1,0.32,1); transform-style: preserve-3d; }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face { backface-visibility: hidden; }
  .card-back { transform: rotateY(180deg); }
  .pulse-glow { animation: pulse-green 2s infinite; }
  @keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(77,224,130,0.4); }
    70% { box-shadow: 0 0 0 10px rgba(77,224,130,0); }
    100% { box-shadow: 0 0 0 0 rgba(77,224,130,0); }
  }
  body { background-color: #05070a; overflow-x: hidden; min-height: max(884px, 100dvh); }
  .nav-item.active .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }
  @media (prefers-reduced-motion: reduce) {
    .card-inner, .pulse-glow { animation: none !important; transition: none !important; }
  }
  ::-webkit-scrollbar { width: 0px; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="font-body-lg text-on-background">

<main>
  {% block content %}{% endblock %}
</main>

{% if user.is_authenticated %}
<!-- ══════════════════════════════ BOTTOM NAV ══════════════════════════════ -->
<nav class="fixed bottom-0 left-0 right-0 h-bottom-nav-height bg-surface-container-low/95 backdrop-blur-lg border-t border-outline-variant/40 z-40">
  <div class="grid grid-cols-5 h-full max-w-md mx-auto">

    <a href="{% url 'lobby' %}"
       class="nav-item {% if request.resolver_match.url_name == 'lobby' %}active text-primary{% else %}text-on-surface-variant{% endif %} flex flex-col items-center justify-center gap-1">
      <span class="material-symbols-outlined text-[22px]">sports_cricket</span>
      <span class="font-body-sm text-[10px]">Play</span>
    </a>

    <a href="{% url 'my_decks' %}"
       class="nav-item {% if 'deck' in request.resolver_match.url_name %}active text-primary{% else %}text-on-surface-variant{% endif %} flex flex-col items-center justify-center gap-1">
      <span class="material-symbols-outlined text-[22px]">style</span>
      <span class="font-body-sm text-[10px]">Decks</span>
    </a>

    <a href="{% url 'tournament_hub' %}"
       class="nav-item {% if 'tournament' in request.resolver_match.url_name %}active text-primary{% else %}text-on-surface-variant{% endif %} flex flex-col items-center justify-center gap-1 relative">
      <span class="material-symbols-outlined text-[22px]">emoji_events</span>
      <span class="font-body-sm text-[10px]">Compete</span>
    </a>

    <a href="{% url 'watch_matches' %}"
       class="nav-item {% if 'watch' in request.resolver_match.url_name %}active text-primary{% else %}text-on-surface-variant{% endif %} flex flex-col items-center justify-center gap-1">
      <span class="material-symbols-outlined text-[22px]">visibility</span>
      <span class="font-body-sm text-[10px]">Watch</span>
    </a>

    <a href="{% url 'profile' %}"
       class="nav-item {% if request.resolver_match.url_name == 'profile' %}active text-primary{% else %}text-on-surface-variant{% endif %} flex flex-col items-center justify-center gap-1">
      <span class="material-symbols-outlined text-[22px]">account_circle</span>
      <span class="font-body-sm text-[10px]">Profile</span>
    </a>

  </div>
</nav>
{% endif %}

{% block extra_scripts %}{% endblock %}
</body>
</html>
